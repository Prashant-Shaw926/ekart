<div class="main">
  <div class="search">
    <app-search (selectedFilterSearch)="searchFilter($event)"></app-search>
  </div>
  <div class="products">
    <app-product-list [searchText] = 'searchText' #productListComponent></app-product-list>
    @if (productListComponent.selectedProduct) {<app-product-detail [productListCom] = 'productListComponent'></app-product-detail>}
  </div>
</div>
