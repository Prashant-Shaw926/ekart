<app-filter
  [all]="allProducts"
  [inStock]="inStockProducts"
  [outOfStock]="outOfStockProducts"
  (selectedFilterRadioButtonChanged)="filterChange($event)"
></app-filter>
<div class="main">
  <!-- *ngIf="
    selectedFilterRadioButton === 'all' ||
    prod.is_in_inventory.toString() === selectedFilterRadioButton
  " -->
  <ng-container *ngFor="let prod of products">
    <app-product
      [product]="prod"
      *ngIf="searchText === '' || prod.name.toLowerCase().includes(searchText)"
      (click) = 'selectedProduct = prod'
    ></app-product>
  </ng-container>
</div>
